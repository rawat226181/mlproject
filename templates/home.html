<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Exam Performance Predictor</title>
  <style>
    /* Import Google Font */
    @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap');

    body {
      margin: 0;
      font-family: 'Roboto', sans-serif;
      background: linear-gradient(135deg, #74ebd5 0%, #ACB6E5 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: #333;
    }

    .container {
      background: #fff;
      padding: 40px 50px;
      border-radius: 15px;
      box-shadow: 0 15px 30px rgba(0,0,0,0.2);
      max-width: 500px;
      width: 90%;
      animation: fadeIn 1s ease-in-out;
    }

    h1 {
      text-align: center;
      color: #4a4e69;
      margin-bottom: 30px;
      font-size: 1.8rem;
    }

    label {
      font-weight: bold;
      display: block;
      margin-bottom: 5px;
      color: #555;
    }

    select, input[type="number"], input[type="submit"] {
      width: 100%;
      padding: 10px 15px;
      margin-bottom: 20px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 1rem;
    }

    input[type="submit"] {
      background: #6a82fb;
      color: white;
      font-weight: bold;
      cursor: pointer;
      border: none;
      transition: 0.3s;
    }

    input[type="submit"]:hover {
      background: #fc5c7d;
      transform: translateY(-3px);
      box-shadow: 0 6px 15px rgba(0,0,0,0.2);
    }

    h2 {
      text-align: center;
      color: #222;
      margin-top: 20px;
      background: #f0f0f0;
      padding: 15px;
      border-radius: 10px;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Responsive for mobile */
    @media(max-width: 600px){
      .container {
        padding: 30px 20px;
      }
      h1 { font-size: 1.5rem; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Student Exam Performance Predictor 🎓</h1>
    <form action="{{ url_for('predict_datapoint')}}" method="post">
      
      <!-- Gender -->
      <label>Gender</label>
      <select name="gender" required>
        <option value="" disabled selected>Select Gender</option>
        <option value="male">Male</option>
        <option value="female">Female</option>
      </select>

      <!-- Ethnicity -->
      <label>Race/Ethnicity</label>
      <select name="ethnicity" required>
        <option value="" disabled selected>Select Ethnicity</option>
        <option value="group A">Group A</option>
        <option value="group B">Group B</option>
        <option value="group C">Group C</option>
        <option value="group D">Group D</option>
        <option value="group E">Group E</option>
      </select>

      <!-- Parental Education -->
      <label>Parental Level of Education</label>
      <select name="parental_level_of_education" required>
        <option value="" disabled selected>Select Education Level</option>
        <option value="associate's degree">Associate's Degree</option>
        <option value="bachelor's degree">Bachelor's Degree</option>
        <option value="high school">High School</option>
        <option value="master's degree">Master's Degree</option>
        <option value="some college">Some College</option>
        <option value="some high school">Some High School</option>
      </select>

      <!-- Lunch -->
      <label>Lunch Type</label>
      <select name="lunch" required>
        <option value="" disabled selected>Select Lunch Type</option>
        <option value="free/reduced">Free/Reduced</option>
        <option value="standard">Standard</option>
      </select>

      <!-- Test Preparation -->
      <label>Test Preparation Course</label>
      <select name="test_preparation_course" required>
        <option value="" disabled selected>Select Course</option>
        <option value="none">None</option>
        <option value="completed">Completed</option>
      </select>

      <!-- Scores -->
      <label>Reading Score (0-100)</label>
      <input type="number" name="reading_score" min="0" max="100" placeholder="Enter Reading Score" required>

      <label>Writing Score (0-100)</label>
      <input type="number" name="writing_score" min="0" max="100" placeholder="Enter Writing Score" required>

      <input type="submit" value="Predict Your Maths Score">
    </form>

    {% if result %}
      <h2>🎯 Prediction Result: {{result}}</h2>
    {% endif %}
  </div>
</body>
</html>
